version: '3.8'

services:
  kpi-prediction-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: kpi-prediction-system
    ports:
      - "8000:8000"
    environment:
      - APP_NAME=KPI Prediction System
      - DEBUG=True
      - HOST=0.0.0.0
      - PORT=8000
      - LOG_LEVEL=INFO
      - DATABASE_URL=sqlite:///./data/kpi_system.db
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Optional: Redis for caching (uncomment if needed)
