<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KPI Prediction System - Real-time Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        .header {
            background: white;
            padding: 20px 30px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            margin-bottom: 20px;
        }

        .header h1 {
            color: #333;
            font-size: 28px;
            margin-bottom: 10px;
        }

        .header .subtitle {
            color: #666;
            font-size: 14px;
        }

        .controls {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            margin-bottom: 20px;
            display: flex;
            gap: 15px;
            align-items: center;
            flex-wrap: wrap;
        }

        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.3s;
        }

        .btn-start {
            background: #10b981;
            color: white;
        }

        .btn-start:hover {
            background: #059669;
        }

        .btn-stop {
            background: #ef4444;
            color: white;
        }

        .btn-stop:hover {
            background: #dc2626;
        }

        .btn-refresh {
            background: #3b82f6;
            color: white;
        }

        .btn-refresh:hover {
            background: #2563eb;
        }

        .status {
            padding: 8px 16px;
            border-radius: 5px;
            font-size: 14px;
            font-weight: 600;
        }

        .status.running {
            background: #d1fae5;
            color: #065f46;
        }

        .status.stopped {
            background: #fee2e2;
            color: #991b1b;
        }

        .kpi-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(600px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }

        .kpi-card {
            background: white;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            padding: 20px;
        }

        .kpi-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            padding-bottom: 15px;
            border-bottom: 2px solid #f3f4f6;
        }

        .kpi-title {
            font-size: 20px;
            font-weight: 700;
            color: #333;
        }

        .kpi-status {
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
        }

        .kpi-status.active {
            background: #d1fae5;
            color: #065f46;
        }

        .kpi-status.inactive {
            background: #f3f4f6;
            color: #6b7280;
        }

        .kpi-metrics {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin-bottom: 20px;
        }

        .metric {
            text-align: center;
            padding: 15px;
            background: #f9fafb;
            border-radius: 8px;
        }

        .metric-label {
            font-size: 12px;
            color: #6b7280;
            margin-bottom: 5px;
        }

        .metric-value {
            font-size: 24px;
            font-weight: 700;
            color: #333;
        }

        .metric-value.positive {
            color: #10b981;
        }

        .metric-value.negative {
            color: #ef4444;
        }

        .chart-container {
            position: relative;
            height: 300px;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #6b7280;
        }

        .alert-badge {
            display: inline-block;
            padding: 4px 8px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: 600;
            background: #fee2e2;
            color: #991b1b;
            margin-left: 10px;
        }

        .no-data {
            text-align: center;
            padding: 40px;
            color: #9ca3af;
            font-size: 14px;
        }

        select {
            padding: 8px 12px;
            border: 1px solid #d1d5db;
            border-radius: 5px;
            font-size: 14px;
            cursor: pointer;
        }

        .auto-refresh {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .auto-refresh input[type="checkbox"] {
            width: 18px;
            height: 18px;
            cursor: pointer;
        }

        .threshold-info {
            font-size: 11px;
            color: #6b7280;
            margin-top: 5px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🚀 KPI Prediction System</h1>
            <p class="subtitle">Real-time monitoring with dynamic thresholds</p>
        </div>

        <div class="controls">
            <button class="btn btn-start" onclick="startMonitoring()">▶ Start All</button>
            <button class="btn btn-stop" onclick="stopMonitoring()">⏸ Stop All</button>
            <button class="btn btn-refresh" onclick="refreshData()">🔄 Refresh</button>
            
            <select id="timeRange" onchange="refreshData()">
                <option value="15">Last 15 minutes</option>
                <option value="30">Last 30 minutes</option>
                <option value="60" selected>Last 1 hour</option>
                <option value="120">Last 2 hours</option>
                <option value="360">Last 6 hours</option>
            </select>

            <div class="auto-refresh">
                <input type="checkbox" id="autoRefresh" checked onchange="toggleAutoRefresh()">
                <label for="autoRefresh">Auto-refresh (30s)</label>
            </div>

            <div id="globalStatus" class="status stopped">Stopped</div>
        </div>

        <div id="kpiGrid" class="kpi-grid">
            <div class="loading">Loading KPIs...</div>
        </div>
    </div>

    <script>
        const API_BASE = window.location.origin;
        let charts = {};
        let kpiConfigs = {}; // Store alert configs per KPI
        let autoRefreshInterval = null;

        // Initialize
        document.addEventListener('DOMContentLoaded', () => {
            loadKPIs();
            startAutoRefresh();
        });

        async function loadKPIs() {
            try {
                const response = await fetch(`${API_BASE}/api/v1/monitoring/kpis`);
                const data = await response.json();
                
                if (data.kpis && data.kpis.length > 0) {
                    // Load alert configs for all KPIs
                    await loadAlertConfigs(data.kpis);
                    renderKPIs(data.kpis);
                    await refreshData();
                } else {
                    document.getElementById('kpiGrid').innerHTML = 
                        '<div class="no-data">No KPIs configured. Please run the startup wizard.</div>';
                }
            } catch (error) {
                console.error('Failed to load KPIs:', error);
                document.getElementById('kpiGrid').innerHTML = 
                    '<div class="no-data">Failed to load KPIs. Please ensure the server is running.</div>';
            }
        }

        async function loadAlertConfigs(kpis) {
            for (const kpi of kpis) {
                try {
                    const response = await fetch(`${API_BASE}/api/v1/alerts/config/${kpi}`);
                    const config = await response.json();
                    kpiConfigs[kpi] = config;
                } catch (error) {
                    console.error(`Failed to load config for ${kpi}:`, error);
                    // Use defaults
                    kpiConfigs[kpi] = {
                        upper_threshold_percentage: 30.0,
                        lower_threshold_percentage: 30.0
                    };
                }
            }
        }

        function renderKPIs(kpis) {
            const grid = document.getElementById('kpiGrid');
            grid.innerHTML = '';

            kpis.forEach(kpi => {
                const config = kpiConfigs[kpi] || { upper_threshold_percentage: 30, lower_threshold_percentage: 30 };
                const card = document.createElement('div');
                card.className = 'kpi-card';
                card.id = `kpi-${kpi}`;
                card.innerHTML = `
                    <div class="kpi-header">
                        <div>
                            <div class="kpi-title">${kpi}</div>
                            <div class="threshold-info">Upper: +${config.upper_threshold_percentage}% | Lower: -${config.lower_threshold_percentage}%</div>
                        </div>
                        <div class="kpi-status inactive" id="status-${kpi}">Inactive</div>
                    </div>
                    <div class="kpi-metrics">
                        <div class="metric">
                            <div class="metric-label">Current</div>
                            <div class="metric-value" id="current-${kpi}">--</div>
                        </div>
                        <div class="metric">
                            <div class="metric-label">Predicted</div>
                            <div class="metric-value" id="predicted-${kpi}">--</div>
                        </div>
                        <div class="metric">
                            <div class="metric-label">Deviation</div>
                            <div class="metric-value" id="deviation-${kpi}">--</div>
                        </div>
                    </div>
                    <div class="chart-container">
                        <canvas id="chart-${kpi}"></canvas>
                    </div>
                `;
                grid.appendChild(card);

                // Initialize chart
                initChart(kpi);
            });
        }

        function initChart(kpi) {
            const ctx = document.getElementById(`chart-${kpi}`).getContext('2d');
            const config = kpiConfigs[kpi] || { upper_threshold_percentage: 30, lower_threshold_percentage: 30 };
            
            charts[kpi] = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: [],
                    datasets: [
                        {
                            label: 'Actual',
                            data: [],
                            borderColor: '#3b82f6',
                            backgroundColor: 'rgba(59, 130, 246, 0.1)',
                            tension: 0.4,
                            fill: true,
                            pointRadius: 3,
                            pointHoverRadius: 5
                        },
                        {
                            label: 'Predicted',
                            data: [],
                            borderColor: '#10b981',
                            backgroundColor: 'rgba(16, 185, 129, 0.1)',
                            tension: 0.4,
                            fill: false,
                            borderDash: [5, 5],
                            pointRadius: 3,
                            pointHoverRadius: 5
                        },
                        {
                            label: `Upper (+${config.upper_threshold_percentage}%)`,
                            data: [],
                            borderColor: '#f59e0b',
                            backgroundColor: 'transparent',
                            borderWidth: 2,
                            borderDash: [10, 5],
                            fill: false,
                            pointRadius: 0,
                            pointHoverRadius: 0
                        },
                        {
                            label: `Lower (-${config.lower_threshold_percentage}%)`,
                            data: [],
                            borderColor: '#ef4444',
                            backgroundColor: 'transparent',
                            borderWidth: 2,
                            borderDash: [10, 5],
                            fill: false,
                            pointRadius: 0,
                            pointHoverRadius: 0
                        }
                    ]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: {
                            display: true,
                            position: 'top'
                        },
                        tooltip: {
                            mode: 'index',
                            intersect: false,
                            callbacks: {
                                label: function(context) {
                                    let label = context.dataset.label || '';
                                    if (label) {
                                        label += ': ';
                                    }
                                    if (context.parsed.y !== null) {
                                        label += Math.round(context.parsed.y);
                                    }
                                    return label;
                                }
                            }
                        }
                    },
                    scales: {
                        x: {
                            display: true,
                            title: {
                                display: true,
                                text: 'Time'
                            }
                        },
                        y: {
                            display: true,
                            title: {
                                display: true,
                                text: 'Value'
                            },
                            ticks: {
                                callback: function(value) {
                                    return Math.round(value);
                                }
                            }
                        }
                    }
                }
            });
        }

        async function refreshData() {
            try {
                const statusResponse = await fetch(`${API_BASE}/api/v1/monitoring/status`);
                const statusData = await statusResponse.json();
                
                updateGlobalStatus(statusData);

                const minutes = parseInt(document.getElementById('timeRange').value);
                
                for (const kpi in statusData.kpis) {
                    await updateKPIData(kpi, minutes, statusData.kpis[kpi]);
                }
            } catch (error) {
                console.error('Failed to refresh data:', error);
            }
        }

        function updateGlobalStatus(statusData) {
            const statusEl = document.getElementById('globalStatus');
            const runningCount = statusData.running_kpis || 0;
            const totalCount = statusData.total_kpis || 0;
            
            if (runningCount > 0) {
                statusEl.textContent = `Running (${runningCount}/${totalCount})`;
                statusEl.className = 'status running';
            } else {
                statusEl.textContent = 'Stopped';
                statusEl.className = 'status stopped';
            }
        }

        async function updateKPIData(kpi, minutes, status) {
            try {
                const dataResponse = await fetch(
                    `${API_BASE}/api/v1/monitoring/data/${kpi}?minutes=${minutes}`
                );
                const data = await dataResponse.json();
                
                // Update status
                const statusEl = document.getElementById(`status-${kpi}`);
                if (status.running) {
                    statusEl.textContent = 'Active';
                    statusEl.className = 'kpi-status active';
                } else {
                    statusEl.textContent = 'Inactive';
                    statusEl.className = 'kpi-status inactive';
                }
                
                if (data.data && data.data.length > 0) {
                    const latest = data.data[data.data.length - 1];
                    
                    // Update metrics - SHOW WHOLE NUMBERS
                    document.getElementById(`current-${kpi}`).textContent = 
                        latest.actual_value ? Math.round(latest.actual_value) : '--';
                    
                    document.getElementById(`predicted-${kpi}`).textContent = 
                        latest.predicted_value ? Math.round(latest.predicted_value) : '--';
                    
                    const deviationEl = document.getElementById(`deviation-${kpi}`);
                    if (latest.deviation !== null && latest.deviation !== undefined) {
                        const deviation = latest.deviation;
                        const sign = deviation >= 0 ? '+' : '';
                        deviationEl.textContent = `${sign}${deviation.toFixed(2)}%`;
                        
                        // Color code: GREEN for positive, RED for negative
                        if (deviation >= 0) {
                            deviationEl.className = 'metric-value positive';
                        } else {
                            deviationEl.className = 'metric-value negative';
                        }
                    } else {
                        deviationEl.textContent = '--';
                        deviationEl.className = 'metric-value';
                    }
                    
                    // Update chart
                    updateChart(kpi, data.data);
                }
            } catch (error) {
                console.error(`Failed to update KPI ${kpi}:`, error);
            }
        }

        function updateChart(kpi, data) {
            const chart = charts[kpi];
            if (!chart) return;
            
            const config = kpiConfigs[kpi] || { upper_threshold_percentage: 30, lower_threshold_percentage: 30 };
            
            const labels = data.map(d => {
                const date = new Date(d.timestamp);
                return date.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit' });
            });
            
            const actualData = data.map(d => d.actual_value);
            const predictedData = data.map(d => d.predicted_value);
            
            // Calculate threshold lines based on predicted values and DYNAMIC thresholds
            const upperThreshold = predictedData.map(p => p ? p * (1 + config.upper_threshold_percentage / 100) : null);
            const lowerThreshold = predictedData.map(p => p ? p * (1 - config.lower_threshold_percentage / 100) : null);
            
            chart.data.labels = labels;
            chart.data.datasets[0].data = actualData;
            chart.data.datasets[1].data = predictedData;
            chart.data.datasets[2].data = upperThreshold;
            chart.data.datasets[3].data = lowerThreshold;
            
            // Update legend labels with current thresholds
            chart.data.datasets[2].label = `Upper (+${config.upper_threshold_percentage}%)`;
            chart.data.datasets[3].label = `Lower (-${config.lower_threshold_percentage}%)`;
            
            chart.update('none');
        }

        async function startMonitoring() {
            try {
                const response = await fetch(`${API_BASE}/api/v1/monitoring/start`, {
                    method: 'POST'
                });
                const data = await response.json();
                console.log('Started monitoring:', data);
                await refreshData();
            } catch (error) {
                console.error('Failed to start monitoring:', error);
                alert('Failed to start monitoring. Please check the console.');
            }
        }

        async function stopMonitoring() {
            try {
                const response = await fetch(`${API_BASE}/api/v1/monitoring/stop`, {
                    method: 'POST'
                });
                const data = await response.json();
                console.log('Stopped monitoring:', data);
                await refreshData();
            } catch (error) {
                console.error('Failed to stop monitoring:', error);
                alert('Failed to stop monitoring. Please check the console.');
            }
        }

        function toggleAutoRefresh() {
            const checkbox = document.getElementById('autoRefresh');
            if (checkbox.checked) {
                startAutoRefresh();
            } else {
                stopAutoRefresh();
            }
        }

        function startAutoRefresh() {
            stopAutoRefresh();
            autoRefreshInterval = setInterval(refreshData, 30000); // 30 seconds
        }

        function stopAutoRefresh() {
            if (autoRefreshInterval) {
                clearInterval(autoRefreshInterval);
                autoRefreshInterval = null;
            }
        }
    </script>
</body>
</html>
